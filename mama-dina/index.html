<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطبخ ماما دينا | أكل بيتي بطعم زمان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ef; --card:#fff; --ink:#3a1c10; --muted:#8a6c5a;
    --brand:#d62828; --brand-dark:#a4161a; --wa:#16a34a; --line:#f3e3d6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:120px}
  .demo{background:var(--ink);color:#fcd9b8;text-align:center;font-size:13px;padding:7px}
  header{background-color:#c81d25;background-image:radial-gradient(circle at 15% 20%,rgba(255,255,255,.18) 0 60px,transparent 61px),radial-gradient(circle at 90% 70%,rgba(255,255,255,.12) 0 90px,transparent 91px);color:#fff;padding:26px 20px 58px;text-align:center;border-radius:0 0 30px 30px}
  .logo{width:86px;height:86px;border-radius:50%;background:#fff;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:46px;border:4px solid #fcbf49;box-shadow:0 8px 20px rgba(0,0,0,.18)}
  header h1{font-size:32px;font-weight:900;letter-spacing:-.5px}
  header p{font-size:14.5px;opacity:.95;margin-top:2px}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .chips span{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:999px;font-size:12px}
  .call{display:inline-flex;gap:6px;align-items:center;margin-top:14px;background:#fff;color:var(--brand-dark);font-weight:800;text-decoration:none;padding:8px 18px;border-radius:999px;font-size:14px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;margin-top:-26px;position:sticky;top:0;z-index:5;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:none;background:#fff;color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;padding:9px 18px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.08);cursor:pointer}
  .tab.on{background:var(--ink);color:#fff}
  main{padding:6px 16px;max-width:620px;margin:0 auto}
  h2{font-size:19px;margin:18px 4px 4px}
  .sub{font-size:13px;color:var(--muted);margin:0 4px 10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
  .top{display:flex;gap:12px}
  .pic{width:74px;height:74px;flex:0 0 74px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:38px;background:#fff1cc}
  .meta{flex:1;min-width:0}
  .meta h3{font-size:16.5px;font-weight:800;line-height:1.4}
  .serves{display:inline-block;font-size:12px;background:#fff1cc;color:var(--brand-dark);padding:2px 10px;border-radius:999px;margin-top:4px;font-weight:700}
  ul{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line)}
  li{font-size:13.5px;color:#5a4335;padding:2px 0}
  li::before{content:"• ";color:var(--brand)}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .price{font-weight:900;color:var(--brand-dark);font-size:19px}
  .old{font-size:13px;color:#b5a091;text-decoration:line-through;margin-right:6px;font-weight:600}
  .save{display:inline-block;background:#16a34a;color:#fff;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;margin-top:4px;margin-right:4px}
  .add{border:none;background:var(--brand);color:#fff;font-family:inherit;font-weight:800;border-radius:12px;padding:7px 16px;font-size:14px;cursor:pointer}
  .qty{display:flex;align-items:center;gap:10px;background:#fff1e6;border-radius:12px;padding:3px 6px}
  .qty button{border:none;background:var(--brand);color:#fff;width:30px;height:30px;border-radius:9px;font-size:18px;cursor:pointer;font-family:inherit}
  .qty b{min-width:16px;text-align:center}
  .bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;box-shadow:0 -6px 20px rgba(0,0,0,.07);display:none}
  .bar.show{display:block}
  .bar .sum{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:var(--muted)}
  .bar .sum b{color:var(--ink);font-size:17px}
  .send{width:100%;border:none;background:var(--wa);color:#fff;font-family:inherit;font-weight:800;font-size:16px;padding:13px;border-radius:14px;cursor:pointer}
  footer{text-align:center;color:var(--muted);font-size:12.5px;padding:22px 20px}
</style>
</head>
<body>
<div class="demo">نسخة تجريبية معمولة مخصوص لـ مطبخ ماما دينا</div>
<header>
  <div class="logo">👩‍🍳</div>
  <h1>مطبخ ماما دينا</h1>
  <p>أكل بيتي بطعم زمان بجد ❤️</p>
  <div class="chips"><span>🍲 أكل بيتي بجودة عالية</span><span>🛵 دليفري للقاهرة والجيزة</span></div>
  <a class="call" id="call">📞 اتصل واطلب</a>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="menu"></main>
<footer>اختار طلبك واضغط "ابعت الطلب"، والطلب هيوصل لماما دينا على الواتساب على طول ❤️</footer>

<div class="bar" id="bar">
  <div class="sum"><span id="count"></span><span>الإجمالي: <b id="total"></b></span></div>
  <button class="send" id="send">ابعت الطلب على الواتساب</button>
</div>

<script>
  // ===== بيانات المطبخ =====
  const PHONE = "01029310927";
  const WHATSAPP = "201155366775";
  const SHOP = "مطبخ ماما دينا";
  const MENU = [
    {cat:"عروض العزومة", sub:"سفرة كاملة بطعم البيت ولمّة الحبايب", items:[
      {n:"عرض المشويات", s:"سفرة كاملة", p:600, o:700, e:"🍖",
        l:["كفتة مشوية على الفحم","فراخ مشوية بتتبيلة ماما دينا","صينية مكرونة بالبشاميل"]},
      {n:"عرض الصواني", s:"٤ صواني جاهزين عالفرن", p:800, o:1000, e:"🥘",
        l:["صينية مكرونة بالبشاميل","صينية جلاش","صينية مسقعة باللحمة","صينية بطاطس محشية"]}
    ]},
    {cat:"محاشي", sub:"", items:[
      {n:"محشي كرنب", s:"٢ كيلو", p:250, o:300, e:"🥬",
        l:["٢ كيلو محشي كرنب بطعم المحشي البيتي الأصيل"]}
    ]},
    {cat:"عرض التفريز", sub:"جهّزي فريزرك وريّحي نفسك، كله جاهز عالتحمير والشوي", items:[
      {n:"عرض التفريز ولانش بوكس المدرسة", s:"١٢ صنف", p:2000, o:0, e:"🧊",
        l:["نص كيلو كفتة مشوية","فرخة متبلة للشوي","نص كيلو أجنحة كنتاكي","نص كيلو بفتيك","نص كيلو بانيه","نص كيلو استربس","نص كيلو كوردن بلو","نص كيلو كفتة أرز","نص كيلو ممبار","نص كيلو سمبوسة ميكس","نص كيلو كبدة بالردة","نص كيلو كبدة إسكندراني"]}
    ]}
  ];
  // =========================

  document.getElementById('call').href="tel:"+PHONE;
  const cart={};
  const ar=n=>n.toLocaleString('ar-EG');
  const tabs=document.getElementById('tabs'), menu=document.getElementById('menu');

  MENU.forEach((sec,si)=>{
    const t=document.createElement('button');
    t.className='tab'+(si===0?' on':''); t.textContent=sec.cat;
    t.onclick=()=>{document.getElementById('s'+si).scrollIntoView({behavior:'smooth',block:'start'});
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');};
    tabs.appendChild(t);
    const h=document.createElement('h2'); h.id='s'+si; h.textContent=sec.cat; h.style.scrollMarginTop='70px'; menu.appendChild(h);
    if(sec.sub){const s=document.createElement('p'); s.className='sub'; s.textContent=sec.sub; menu.appendChild(s);}
    sec.items.forEach((it,ii)=>{
      const id=si+'-'+ii, el=document.createElement('div'); el.className='item';
      el.innerHTML=`<div class="top"><div class="pic">${it.e}</div>
        <div class="meta"><h3>${it.n}</h3><span class="serves">${it.s}</span>${it.o?`<span class="save">وفّر ${ar(it.o-it.p)} ج</span>`:''}</div></div>
        <ul>${it.l.map(x=>`<li>${x}</li>`).join('')}</ul>
        <div class="row"><div><span class="price">${ar(it.p)} ج</span>${it.o?`<span class="old">${ar(it.o)} ج</span>`:''}</div><span id="c${id}"></span></div>`;
      menu.appendChild(el); draw(id,it);
    });
  });

  function draw(id,it){
    const box=document.getElementById('c'+id), q=cart[id]?.q||0;
    if(!q){box.innerHTML=`<button class="add">أضف +</button>`;
      box.firstChild.onclick=()=>{cart[id]={...it,q:1};draw(id,it);update();};}
    else{box.innerHTML=`<div class="qty"><button>+</button><b>${q}</b><button>−</button></div>`;
      const [plus,,minus]=box.firstChild.children;
      plus.onclick=()=>{cart[id].q++;draw(id,it);update();};
      minus.onclick=()=>{cart[id].q--; if(!cart[id].q) delete cart[id]; draw(id,it);update();};}
  }
  function update(){
    const list=Object.values(cart), bar=document.getElementById('bar');
    if(!list.length){bar.classList.remove('show');return;}
    bar.classList.add('show');
    document.getElementById('count').textContent=ar(list.reduce((a,b)=>a+b.q,0))+" طلب";
    document.getElementById('total').textContent=ar(list.reduce((a,b)=>a+b.q*b.p,0))+" ج";
  }
  document.getElementById('send').onclick=()=>{
    const list=Object.values(cart); let total=0;
    let msg=`السلام عليكم، عاوز أطلب من ${SHOP}:\n\n`;
    list.forEach(x=>{msg+=`• ${x.n} × ${x.q} = ${x.q*x.p} ج\n`; total+=x.q*x.p;});
    msg+=`\nالإجمالي: ${total} ج\n\nالاسم:\nالعنوان:\nميعاد التوصيل:`;
    window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank');
  };
</script>
</body>
</html>
