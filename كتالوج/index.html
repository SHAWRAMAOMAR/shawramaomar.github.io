<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حلويات بيت ماما | المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8f1; --card:#ffffff; --ink:#3b2416; --muted:#8a6f5e;
    --brand:#c2410c; --brand2:#f59e0b; --wa:#16a34a; --line:#f1e4d8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px}
  .demo{background:#3b2416;color:#fde68a;text-align:center;font-size:13px;padding:6px}
  header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:28px 20px 56px;text-align:center;border-radius:0 0 28px 28px}
  .logo{width:78px;height:78px;border-radius:50%;background:#fff;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  header h1{font-size:26px;font-weight:800}
  header p{opacity:.92;font-size:14px;margin-top:4px}
  .info{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .info span{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:999px;font-size:12px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px;margin-top:-24px;position:sticky;top:0;z-index:5;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:none;background:#fff;color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;padding:9px 18px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.08);cursor:pointer}
  .tab.on{background:var(--ink);color:#fff}
  main{padding:8px 16px;max-width:620px;margin:0 auto}
  h2{font-size:18px;margin:18px 4px 10px}
  .item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;align-items:center}
  .pic{width:82px;height:82px;flex:0 0 82px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:42px}
  .meta{flex:1;min-width:0}
  .meta h3{font-size:16px;font-weight:700}
  .meta p{font-size:12.5px;color:var(--muted);margin:2px 0 6px;line-height:1.5}
  .row{display:flex;align-items:center;justify-content:space-between}
  .price{font-weight:800;color:var(--brand);font-size:16px}
  .add{border:none;background:var(--brand);color:#fff;font-family:inherit;font-weight:700;border-radius:12px;padding:6px 14px;font-size:14px;cursor:pointer}
  .qty{display:flex;align-items:center;gap:10px;background:#fff1e6;border-radius:12px;padding:3px 6px}
  .qty button{border:none;background:var(--brand);color:#fff;width:28px;height:28px;border-radius:9px;font-size:18px;cursor:pointer;font-family:inherit}
  .qty b{min-width:16px;text-align:center}
  .bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;box-shadow:0 -6px 20px rgba(0,0,0,.06);display:none}
  .bar.show{display:block}
  .bar .sum{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:var(--muted)}
  .bar .sum b{color:var(--ink);font-size:17px}
  .send{width:100%;border:none;background:var(--wa);color:#fff;font-family:inherit;font-weight:800;font-size:16px;padding:13px;border-radius:14px;cursor:pointer}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
</style>
</head>
<body>
<div class="demo">نسخة تجريبية للعرض</div>
<header>
  <div class="logo">🧁</div>
  <h1>حلويات بيت ماما</h1>
  <p>حلويات بيتي معمولة بحب، طازة كل يوم</p>
  <div class="info"><span>🕘 من ١٢ الضهر لـ ١١ بالليل</span><span>🛵 توصيل لكل المناطق</span></div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="menu"></main>
<footer>اختار طلبك واضغط "ابعت الطلب" وهيوصلنا على الواتساب على طول</footer>

<div class="bar" id="bar">
  <div class="sum"><span id="count"></span><span>الإجمالي: <b id="total"></b></span></div>
  <button class="send" id="send">ابعت الطلب على الواتساب</button>
</div>

<script>
  // ===== غيّر البيانات دي لكل عميل =====
  const WHATSAPP = "201000000000"; // رقم واتساب المحل بالصيغة الدولية من غير +
  const SHOP = "حلويات بيت ماما";
  const MENU = [
    {cat:"تورت وكيك", items:[
      {n:"كيكة شوكولاتة",d:"طبقات شوكولاتة غنية بصوص الجاناش",p:350,e:"🍫",c:"#fde2cf"},
      {n:"تشيز كيك فراولة",d:"قاعدة بسكوت وكريمة جبنة وصوص فراولة",p:400,e:"🍰",c:"#ffe4ec"},
      {n:"كيكة رد فيلفت",d:"حجم وسط تكفي ٨ أفراد",p:380,e:"🎂",c:"#fde2e2"}
    ]},
    {cat:"علب وحلويات صغيرة", items:[
      {n:"علبة براونيز",d:"١٢ قطعة بالمكسرات",p:250,e:"🟫",c:"#efe1d4"},
      {n:"علبة كوكيز",d:"١٥ قطعة بقطع الشوكولاتة",p:200,e:"🍪",c:"#fbead1"},
      {n:"ميني بان كيك",d:"٢٠ قطعة مع نوتيلا",p:180,e:"🥞",c:"#fff0c2"}
    ]},
    {cat:"حلويات شرقي", items:[
      {n:"صينية بسبوسة",d:"بالقشطة، حجم وسط",p:220,e:"🍯",c:"#fdf0c4"},
      {n:"أم علي",d:"طاجن فردي بالمكسرات",p:90,e:"🥧",c:"#fde7c8"}
    ]}
  ];
  // ===================================

  const cart = {};
  const fmt = n => n.toLocaleString('ar-EG') + " ج";
  const tabs = document.getElementById('tabs');
  const menu = document.getElementById('menu');

  MENU.forEach((sec,si)=>{
    const t=document.createElement('button');
    t.className='tab'+(si===0?' on':''); t.textContent=sec.cat;
    t.onclick=()=>{document.getElementById('s'+si).scrollIntoView({behavior:'smooth',block:'start'});
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');};
    tabs.appendChild(t);
    const h=document.createElement('h2'); h.id='s'+si; h.textContent=sec.cat; h.style.scrollMarginTop='70px';
    menu.appendChild(h);
    sec.items.forEach((it,ii)=>{
      const id=si+'-'+ii;
      const el=document.createElement('div'); el.className='item';
      el.innerHTML=`<div class="pic" style="background:${it.c}">${it.e}</div>
        <div class="meta"><h3>${it.n}</h3><p>${it.d}</p>
        <div class="row"><span class="price">${fmt(it.p)}</span><span id="c${id}"></span></div></div>`;
      menu.appendChild(el);
      draw(id,it);
    });
  });

  function draw(id,it){
    const box=document.getElementById('c'+id); const q=cart[id]?.q||0;
    if(!q){box.innerHTML=`<button class="add">أضف +</button>`;
      box.firstChild.onclick=()=>{cart[id]={...it,q:1};draw(id,it);update();};}
    else{box.innerHTML=`<div class="qty"><button>+</button><b>${q}</b><button>−</button></div>`;
      const [plus,,minus]=box.firstChild.children;
      plus.onclick=()=>{cart[id].q++;draw(id,it);update();};
      minus.onclick=()=>{cart[id].q--; if(!cart[id].q) delete cart[id]; draw(id,it);update();};}
  }

  function update(){
    const list=Object.values(cart); const bar=document.getElementById('bar');
    if(!list.length){bar.classList.remove('show');return;}
    bar.classList.add('show');
    const count=list.reduce((a,b)=>a+b.q,0), total=list.reduce((a,b)=>a+b.q*b.p,0);
    document.getElementById('count').textContent=count+" منتج";
    document.getElementById('total').textContent=fmt(total);
  }

  document.getElementById('send').onclick=()=>{
    const list=Object.values(cart); let total=0;
    let msg=`السلام عليكم، عاوز أطلب من ${SHOP}:\n\n`;
    list.forEach(x=>{msg+=`• ${x.n} × ${x.q} = ${x.q*x.p} ج\n`; total+=x.q*x.p;});
    msg+=`\nالإجمالي: ${total} ج\n\nالاسم:\nالعنوان:`;
    window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank');
  };
</script>
</body>
</html>
